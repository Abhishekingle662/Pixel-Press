<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Press — Offline Image Compressor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0c0e;
    --surface: #141416;
    --surface2: #1a1a1e;
    --border: #2a2a2e;
    --border-hover: #3a3a3e;
    --text: #d4d4d8;
    --text-muted: #71717a;
    --text-dim: #52525b;
    --accent: #e08a3c;
    --accent-dim: rgba(224, 138, 60, 0.12);
    --green: #5ec269;
    --red: #e05c5c;
    --radius: 10px;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Outfit', sans-serif;
  }

  html { background: var(--bg); color: var(--text); }

  body {
    font-family: var(--sans);
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 20px 80px;
    min-height: 100vh;
  }

  /* ── header ── */
  .header { margin-bottom: 32px; display: flex; align-items: center; gap: 14px; }
  .logo-mark {
    width: 42px; height: 42px; border-radius: 10px;
    background: var(--accent); display: grid; place-items: center;
    color: #0c0c0e; flex-shrink: 0;
  }
  .header h1 {
    font-family: var(--mono); font-size: 20px; font-weight: 700;
    letter-spacing: -0.03em; color: var(--accent);
  }
  .header p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  /* ── controls panel ── */
  .controls {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px; padding: 18px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--border); margin-bottom: 20px;
  }
  .ctrl-label {
    display: block; font-family: var(--mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted); margin-bottom: 8px;
  }
  .ctrl-label strong { color: var(--text); font-weight: 500; }
  input[type="range"] {
    -webkit-appearance: none; width: 100%; height: 4px;
    border-radius: 2px; background: var(--border); outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
    border: 2px solid var(--bg);
  }
  .slider-hints {
    display: flex; justify-content: space-between;
    font-size: 9px; color: var(--text-dim); margin-top: 4px; font-family: var(--mono);
  }
  .format-row { display: flex; gap: 6px; }
  .format-btn {
    flex: 1; padding: 7px 0; border: 1px solid var(--border); border-radius: 8px;
    background: transparent; color: var(--text-muted); font-family: var(--mono);
    font-size: 12px; cursor: pointer; transition: all 0.15s;
  }
  .format-btn:hover { border-color: var(--border-hover); }
  .format-btn.active { background: var(--accent); border-color: var(--accent); color: #0c0c0e; font-weight: 700; }

  .recompress-btn {
    grid-column: 1 / -1; padding: 10px; border: 1px dashed var(--accent);
    border-radius: var(--radius); background: transparent; color: var(--accent);
    font-family: var(--mono); font-size: 12px; font-weight: 500; cursor: pointer;
    transition: background 0.15s; display: none;
  }
  .recompress-btn:hover { background: var(--accent-dim); }
  .recompress-btn.visible { display: block; }

  /* ── drop zone ── */
  .dropzone {
    border: 2px dashed var(--border); border-radius: 14px;
    padding: 52px 24px; text-align: center; cursor: pointer;
    transition: all 0.2s; margin-bottom: 20px; position: relative;
  }
  .dropzone:hover, .dropzone.active { border-color: var(--accent); background: var(--accent-dim); }
  .dropzone svg { color: var(--text-dim); margin-bottom: 10px; }
  .dropzone.active svg { color: var(--accent); }
  .drop-text { font-size: 15px; font-weight: 500; color: var(--text); }
  .drop-hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; font-family: var(--mono); }
  #fileInput { display: none; }

  /* ── summary bar ── */
  .summary {
    display: none; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; padding: 12px 16px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--border); margin-bottom: 20px;
    font-family: var(--mono); font-size: 12px;
  }
  .summary.visible { display: flex; }
  .summary-stats { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .summary-stats .dot { color: var(--text-dim); }
  .summary-actions { display: flex; gap: 8px; }
  .btn-clear {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted); font-family: var(--mono);
    font-size: 11px; cursor: pointer;
  }
  .btn-download-all {
    padding: 7px 16px; border-radius: 8px; border: none;
    background: var(--accent); color: #0c0c0e; font-family: var(--mono);
    font-size: 11px; font-weight: 700; cursor: pointer;
  }

  /* ── card grid ── */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .card {
    position: relative; border-radius: var(--radius); background: var(--surface);
    border: 1px solid var(--border); overflow: hidden;
    animation: cardIn 0.3s ease both;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .card .remove-btn {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    width: 26px; height: 26px; border-radius: 50%; border: none;
    background: rgba(0,0,0,0.6); color: var(--text-muted);
    font-size: 16px; cursor: pointer; display: grid; place-items: center;
    backdrop-filter: blur(4px); line-height: 1;
  }
  .card .remove-btn:hover { color: var(--red); }
  .preview-wrap {
    position: relative; width: 100%; height: 200px;
    background: #09090b; overflow: hidden;
  }
  .preview-wrap img { width: 100%; height: 100%; object-fit: contain; }
  .toggle-bar {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 2px; background: rgba(0,0,0,0.55); border-radius: 8px;
    padding: 2px; backdrop-filter: blur(6px);
  }
  .toggle-pill {
    padding: 4px 12px; border: none; border-radius: 6px;
    background: transparent; color: var(--text-muted); font-family: var(--mono);
    font-size: 10px; cursor: pointer; transition: all 0.15s;
  }
  .toggle-pill.active { background: rgba(255,255,255,0.14); color: #fff; }
  .card-body { padding: 12px 14px 14px; }
  .card-body .filename {
    font-size: 12px; font-weight: 600; margin-bottom: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stat-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px; font-family: var(--mono); }
  .stat-row .label { color: var(--text-dim); }
  .stat-row .value { color: var(--text-muted); }
  .savings-badge {
    display: inline-block; padding: 4px 10px; border-radius: 6px;
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    margin: 8px 0 10px;
  }
  .savings-badge.saved { background: rgba(94,194,105,0.12); color: var(--green); }
  .savings-badge.increased { background: rgba(224,92,92,0.12); color: var(--red); }
  .card .dl-btn {
    width: 100%; padding: 9px 0; border: 1px solid var(--border); border-radius: 8px;
    background: transparent; color: var(--text); font-family: var(--mono);
    font-size: 12px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 6px; transition: all 0.15s;
  }
  .card .dl-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── footer ── */
  .footer {
    text-align: center; margin-top: 48px; font-family: var(--mono);
    font-size: 10px; color: var(--text-dim); letter-spacing: 0.04em;
  }

  /* ── processing overlay ── */
  .processing-overlay {
    position: fixed; inset: 0; background: rgba(12,12,14,0.7);
    display: none; place-items: center; z-index: 100; backdrop-filter: blur(4px);
  }
  .processing-overlay.active { display: grid; }
  .processing-overlay .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .processing-overlay p { color: var(--text-muted); font-family: var(--mono); font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>

<!-- processing overlay -->
<div class="processing-overlay" id="processing">
  <div style="text-align:center;">
    <div class="spinner"></div>
    <p>Compressing...</p>
  </div>
</div>

<!-- header -->
<header class="header">
  <div class="logo-mark">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <path d="M21 15l-5-5L5 21"/>
    </svg>
  </div>
  <div>
    <h1>Pixel Press</h1>
    <p>Offline image compressor — everything stays on your device</p>
  </div>
</header>

<!-- controls -->
<div class="controls">
  <div>
    <label class="ctrl-label">Quality: <strong id="qualityVal">75</strong>%</label>
    <input type="range" id="quality" min="1" max="100" value="75">
    <div class="slider-hints"><span>smallest</span><span>best</span></div>
  </div>
  <div>
    <label class="ctrl-label">Output Format</label>
    <div class="format-row" id="formatRow">
      <button class="format-btn active" data-mime="image/jpeg" data-ext="jpg">JPEG</button>
      <button class="format-btn" data-mime="image/png" data-ext="png">PNG</button>
      <button class="format-btn" data-mime="image/webp" data-ext="webp">WebP</button>
    </div>
  </div>
  <div>
    <label class="ctrl-label">Max Dimension: <strong id="maxDimVal">8192</strong>px</label>
    <input type="range" id="maxDim" min="256" max="8192" step="256" value="8192">
    <div class="slider-hints"><span>256</span><span>8192</span></div>
  </div>
  <button class="recompress-btn" id="recompressBtn">↻ Re-compress with new settings</button>
</div>

<!-- drop zone -->
<div class="dropzone" id="dropzone">
  <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
    <polyline points="17 8 12 3 7 8"/>
    <line x1="12" y1="3" x2="12" y2="15"/>
  </svg>
  <p class="drop-text">Drop images here or click to browse</p>
  <p class="drop-hint">JPEG · PNG · WebP · GIF · BMP · SVG</p>
  <input type="file" id="fileInput" accept="image/*" multiple>
</div>

<!-- summary bar -->
<div class="summary" id="summary">
  <div class="summary-stats" id="summaryStats"></div>
  <div class="summary-actions">
    <button class="btn-clear" id="clearBtn">Clear All</button>
    <button class="btn-download-all" id="downloadAllBtn">Download</button>
  </div>
</div>

<!-- image grid -->
<div class="grid" id="grid"></div>

<!-- footer -->
<footer class="footer">
  100% CLIENT-SIDE — NO UPLOADS, NO SERVERS, NO TRACKING. YOUR IMAGES NEVER LEAVE THIS TAB.
</footer>

<script>
(function () {
  "use strict";

  /* ── state ── */
  let items = [];  // { original: File, blob: Blob, width, height, origW, origH, format }
  let currentFormat = { mime: "image/jpeg", ext: "jpg" };

  /* ── DOM refs ── */
  const $ = (s) => document.querySelector(s);
  const qualitySlider = $("#quality");
  const qualityVal    = $("#qualityVal");
  const maxDimSlider  = $("#maxDim");
  const maxDimVal     = $("#maxDimVal");
  const formatRow     = $("#formatRow");
  const dropzone      = $("#dropzone");
  const fileInput     = $("#fileInput");
  const grid          = $("#grid");
  const summary       = $("#summary");
  const summaryStats  = $("#summaryStats");
  const recompressBtn = $("#recompressBtn");
  const processing    = $("#processing");
  const clearBtn      = $("#clearBtn");
  const downloadAllBtn = $("#downloadAllBtn");

  /* ── helpers ── */
  function fmtSize(b) {
    if (b < 1024) return b + " B";
    if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
    return (b / 1048576).toFixed(2) + " MB";
  }

  /* ── core: compress one image via Canvas ── */
  function compress(file, quality, format, maxDim) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > maxDim || h > maxDim) {
          const r = Math.min(maxDim / w, maxDim / h);
          w = Math.round(w * r);
          h = Math.round(h * r);
        }
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        c.toBlob(
          (blob) => blob ? resolve({ blob, width: w, height: h, origW: img.naturalWidth, origH: img.naturalHeight }) : reject(new Error("toBlob failed")),
          format.mime,
          format.mime === "image/png" ? undefined : quality / 100
        );
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Image load failed")); };
      img.src = url;
    });
  }

  /* ── process files ── */
  async function processFiles(files) {
    const images = Array.from(files).filter(f => f.type.startsWith("image/"));
    if (!images.length) return;
    processing.classList.add("active");
    const q = +qualitySlider.value;
    const md = +maxDimSlider.value;
    for (const file of images) {
      try {
        const res = await compress(file, q, currentFormat, md);
        items.push({ original: file, ...res, format: { ...currentFormat } });
      } catch (e) { console.error("Compress failed:", file.name, e); }
    }
    processing.classList.remove("active");
    render();
  }

  /* ── recompress all ── */
  async function recompressAll() {
    if (!items.length) return;
    processing.classList.add("active");
    const q = +qualitySlider.value;
    const md = +maxDimSlider.value;
    const updated = [];
    for (const item of items) {
      try {
        const res = await compress(item.original, q, currentFormat, md);
        updated.push({ original: item.original, ...res, format: { ...currentFormat } });
      } catch { updated.push(item); }
    }
    items = updated;
    processing.classList.remove("active");
    render();
  }

  /* ── render everything ── */
  function render() {
    // summary
    if (items.length) {
      summary.classList.add("visible");
      recompressBtn.classList.add("visible");
      const totalOrig = items.reduce((s, i) => s + i.original.size, 0);
      const totalComp = items.reduce((s, i) => s + i.blob.size, 0);
      const saved = totalOrig - totalComp;
      summaryStats.innerHTML = `
        <span><strong>${items.length}</strong> image${items.length > 1 ? "s" : ""}</span>
        <span class="dot">·</span>
        <span>${fmtSize(totalOrig)} → ${fmtSize(totalComp)}</span>
        <span class="dot">·</span>
        <span style="color:${saved >= 0 ? "var(--green)" : "var(--red)"}">${saved >= 0 ? "Saved" : "Increased"} ${fmtSize(Math.abs(saved))}</span>
      `;
      downloadAllBtn.textContent = items.length > 1 ? "Download All (.zip)" : "Download";
    } else {
      summary.classList.remove("visible");
      recompressBtn.classList.remove("visible");
    }

    // grid
    grid.innerHTML = "";
    items.forEach((item, idx) => {
      const origUrl = URL.createObjectURL(item.original);
      const compUrl = URL.createObjectURL(item.blob);
      const saved = item.original.size - item.blob.size;
      const pct = ((Math.abs(saved) / item.original.size) * 100).toFixed(1);
      const baseName = item.original.name.replace(/\.[^.]+$/, "");

      const card = document.createElement("div");
      card.className = "card";
      card.style.animationDelay = (idx * 0.04) + "s";
      card.innerHTML = `
        <button class="remove-btn" data-idx="${idx}" title="Remove">×</button>
        <div class="preview-wrap">
          <img src="${compUrl}" alt="${item.original.name}" data-orig="${origUrl}" data-comp="${compUrl}" class="preview-img">
          <div class="toggle-bar">
            <button class="toggle-pill" data-show="orig">Before</button>
            <button class="toggle-pill active" data-show="comp">After</button>
          </div>
        </div>
        <div class="card-body">
          <p class="filename" title="${item.original.name}">${item.original.name}</p>
          <div class="stat-row"><span class="label">Original</span><span class="value">${fmtSize(item.original.size)}</span></div>
          <div class="stat-row"><span class="label">Compressed</span><span class="value">${fmtSize(item.blob.size)}</span></div>
          <div class="stat-row"><span class="label">Dimensions</span><span class="value">${item.width} × ${item.height}</span></div>
          <div class="savings-badge ${saved >= 0 ? "saved" : "increased"}">${saved >= 0 ? `−${pct}% saved (${fmtSize(saved)})` : `+${pct}% larger`}</div>
          <button class="dl-btn" data-idx="${idx}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download
          </button>
        </div>
      `;

      // toggle before/after
      card.querySelectorAll(".toggle-pill").forEach(pill => {
        pill.addEventListener("click", () => {
          const img = card.querySelector(".preview-img");
          const pills = card.querySelectorAll(".toggle-pill");
          pills.forEach(p => p.classList.remove("active"));
          pill.classList.add("active");
          img.src = pill.dataset.show === "orig" ? img.dataset.orig : img.dataset.comp;
        });
      });

      // remove
      card.querySelector(".remove-btn").addEventListener("click", () => {
        items.splice(idx, 1);
        render();
      });

      // single download
      card.querySelector(".dl-btn").addEventListener("click", () => {
        const a = document.createElement("a");
        a.href = compUrl;
        a.download = `${baseName}-compressed.${item.format.ext}`;
        a.click();
      });

      grid.appendChild(card);
    });
  }

  /* ── event wiring ── */
  qualitySlider.addEventListener("input", () => qualityVal.textContent = qualitySlider.value);
  maxDimSlider.addEventListener("input", () => maxDimVal.textContent = maxDimSlider.value);

  formatRow.addEventListener("click", (e) => {
    const btn = e.target.closest(".format-btn");
    if (!btn) return;
    formatRow.querySelectorAll(".format-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFormat = { mime: btn.dataset.mime, ext: btn.dataset.ext };
  });

  dropzone.addEventListener("click", () => fileInput.click());
  dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("active"); });
  dropzone.addEventListener("dragleave", () => dropzone.classList.remove("active"));
  dropzone.addEventListener("drop", (e) => { e.preventDefault(); dropzone.classList.remove("active"); processFiles(e.dataTransfer.files); });
  fileInput.addEventListener("change", (e) => { processFiles(e.target.files); e.target.value = ""; });

  recompressBtn.addEventListener("click", recompressAll);
  clearBtn.addEventListener("click", () => { items = []; render(); });

  downloadAllBtn.addEventListener("click", async () => {
    if (!items.length) return;
    if (items.length === 1) {
      const item = items[0];
      const a = document.createElement("a");
      a.href = URL.createObjectURL(item.blob);
      a.download = `${item.original.name.replace(/\.[^.]+$/, "")}-compressed.${item.format.ext}`;
      a.click();
      URL.revokeObjectURL(a.href);
      return;
    }
    // batch zip
    processing.classList.add("active");
    try {
      const { default: JSZip } = await import("https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm");
      const zip = new JSZip();
      items.forEach(item => {
        const name = `${item.original.name.replace(/\.[^.]+$/, "")}-compressed.${item.format.ext}`;
        zip.file(name, item.blob);
      });
      const content = await zip.generateAsync({ type: "blob" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(content);
      a.download = "compressed-images.zip";
      a.click();
      URL.revokeObjectURL(a.href);
    } catch (e) { console.error("Zip error:", e); }
    processing.classList.remove("active");
  });

})();
</script>
</body>
</html>
